name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Railway deployment
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RAILWAY_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing GitHub secret RAILWAY_DEPLOY_HOOK_URL."
            echo "Railway → continuum-home → Settings → Deploy → Deploy Hook → copy URL"
            echo "GitHub → continuum-home → Settings → Secrets → Actions → New repository secret"
            exit 1
          fi
          curl -fsS -X POST "$RAILWAY_DEPLOY_HOOK_URL"
          echo "Railway deploy triggered."
